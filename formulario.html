<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Formulário - Mitologia Grega</title>

    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap"
        rel="stylesheet">

>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <nav class="menu">
            <div class="logo">⚡ MITOLOGIA GREGA</div>

            <div class="links">
                <a href="index.html">Introdução</a>
                <a href="origemeetc.html">Origem e História</a>
                <a href="Deuses.html">Deuses, Criaturas e Símbolos</a>
                <a href="OBRAS.html">Obras sobre mitologia</a>
                <a href="formulario.html">Formulário</a>
            
            </div>
        </nav>
    </header>

    <main>

        <form class="caixa">

            <h2>ME FALE OQUE ACHOU</h2>

            <div class="mb-3">

                <label for="nome" class="form-label">
                    Seu nome:
                </label>

                <input
                    type="text"
                    class="form-control"
                    id="nome"
                    name="nome"
                    placeholder="Digite seu nome"
                    required>

            </div>

            <div class="mb-3">

                <label for="deus" class="form-label">
                    Qual é o seu deus favorito?
                </label>

                <select
                    class="form-select"
                    id="deus"
                    name="deus"
                    required>

                    <option value="">Escolha um deus</option>
                    <option value="zeus">Zeus ⚡</option>
                    <option value="atena">Atena 🦉</option>
                    <option value="poseidon">Poseidon 🌊</option>
                    <option value="afrodite">Afrodite 💖</option>
                    <option value="hades">Hades 👑</option>
                    <option value="apolo">Apolo ☀️</option>
                    <option value="ares">Ares ⚔️</option>
                    <option value="hermes">Hermes 🪽</option>
                    <option value="hefesto">Hefesto 🔥</option>
                    <option value="artemis">Ártemis 🏹</option>
                    <option value="demeter">Deméter 🌾</option>
                    <option value="dionisio">Dionísio 🍇</option>

                </select>

            </div>

            <div class="mb-3">

                <label for="musica" class="form-label">
                    Qual é a sua música preferida?
                </label>

                <input
                    type="text"
                    class="form-control"
                    id="musica"
                    name="musica"
                    placeholder="Digite o nome da música"
                    required>

            </div>

            <div class="mb-3">

                <label for="artista" class="form-label">
                    Quem canta essa música?
                </label>

                <input
                    type="text"
                    class="form-control"
                    id="artista"
                    name="artista"
                    placeholder="Digite o nome do artista">

            </div>

            <div class="mb-3">

                <label for="comentario" class="form-label">
                    O que você achou do site?
                </label>

                <textarea
                    class="form-control"
                    id="comentario"
                    name="comentario"
                    rows="4"
                    placeholder="Digite sua opinião..."></textarea>

            </div>

            <button type="submit" class="btn btn-primary">
                Enviar
            </button>

            <button type="reset" class="btn btn-secondary">
                Limpar
            </button>

        </form>

    </main>

    <audio id="musicaAudio" loop>
        <source src="musica/Hold Them Down _ EPIC_ The Musical (Animatic) _ [p-P0kaqJg3w].mp3" type="audio/mpeg">
    </audio>

    <button id="botaoMusica" onclick="tocarMusica()">
        🎵
    </button>

    <script>
        function tocarMusica() {

            const musica = document.getElementById("musicaAudio");
            const botao = document.getElementById("botaoMusica");

            if (musica.paused) {

                musica.play();
                botao.innerHTML = "🔊";

            } else {

                musica.pause();
                botao.innerHTML = "🎵";

            }
        }
    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"></script>

</body>
</html>
