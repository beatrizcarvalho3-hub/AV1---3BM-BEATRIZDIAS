 <form>
      <label for="nome">Seu nome:</label><br />
      <input type="text" id="nome" name="nome" required /><br /><br />

      <label for="musica">Qual é a sua música preferida?</label><br />
      <input type="text" id="musica" name="musica" required /><br /><br />

      <label for="artista">Quem canta essa música?</label><br />

      <input type="submit" value="Enviar" />
      <input type="reset" value="Limpar" />
    </form>




    <body>
<audio id="musica" loop>
    <source src="musica/musica.mp3" type="audio/mpeg">
</audio>

<button id="botaoMusica" onclick="tocarMusica()">
    🎵
</button>

<script>
function tocarMusica() {
    const musica = document.getElementById("musica");
    const botao = document.getElementById("botaoMusica");

    if (musica.paused) {
        musica.play();
        botao.innerHTML = "🔊";
    } else {
        musica.pause();
        botao.innerHTML = "🎵";
    }
}
</script>
    </body>
